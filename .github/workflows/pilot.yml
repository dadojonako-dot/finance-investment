name: Pilot acceptance
on:
  push:
    branches: [main, 'codex/pilot-v0.1']
  pull_request:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare isolated database and environment
        run: |
          cp .env.example .env
          node -e "const f=require('fs'),c=require('crypto');f.appendFileSync('.env','\nAUTH_SECRET='+c.randomBytes(48).toString('hex')+'\n')"
          docker compose up -d --wait
      - run: npm run pilot:setup
      - run: npm run db:seed
      - run: npm run pilot:check
      - name: Run HTTP acceptance against production server
        env:
          PILOT_TEST_ALLOW_WRITE: '1'
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/pilot-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/login > /dev/null && break; sleep 1; done
          npm run test:acceptance
      - name: Server diagnostics
        if: failure()
        run: cat /tmp/pilot-server.log || true
      - name: Stop isolated database
        if: always()
        run: docker compose down
